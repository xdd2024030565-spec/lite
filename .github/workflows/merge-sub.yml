name: 合并订阅（自动优选 147 节点）

# 定时拉取两路订阅 → 合并成一份（共用自动优选组）→ 推到仓库
# 产物：merged.yaml，可直接作为 Clash / Mihomo 的订阅地址：
#   https://raw.githubusercontent.com/xdd2024030565-spec/lite/main/merged.yaml
#   或 https://xdd2024030565-spec.github.io/lite/merged.yaml

on:
  schedule:
    - cron: '17 */3 * * *'      # 每 3 小时一次（UTC）
  workflow_dispatch:            # 支持手动触发
  push:
    branches: [main]
    paths:
      - 'merge-sub.js'
      - '.github/workflows/merge-sub.yml'

permissions:
  contents: write

concurrency:
  group: merge-sub
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 生成合并订阅
        env:
          SUB_A: ${{ secrets.SUB_A_URL }}
          SUB_B: ${{ secrets.SUB_B_URL }}
        run: |
          if [ -z "$SUB_A" ] || [ -z "$SUB_B" ]; then
            echo "::error title=缺少订阅地址::请到 Settings → Secrets 添加 SUB_A_URL 与 SUB_B_URL"
            exit 1
          fi
          node merge-sub.js --a "$SUB_A" --b "$SUB_B" -o merged.yaml --interval 300

      - name: 校验产物
        run: |
          node verify-merged.js merged.yaml

      - name: 提交并推送
        run: |
          git config user.name  "sub-bot"
          git config user.email "sub-bot@users.noreply.github.com"
          if git diff --quiet -- merged.yaml; then
            echo "订阅内容无变化，不提交"
            echo "### ℹ️ 无变化（${{ github.run_id }}）" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          N=$(grep -c '^  - {name:' merged.yaml || true)
          git add merged.yaml
          git commit -m "chore(sub): 自动合并订阅（$N 个节点）"
          git push
          echo "### ✅ 已更新，共 $N 个节点" >> $GITHUB_STEP_SUMMARY
          echo "订阅地址：https://raw.githubusercontent.com/${{ github.repository }}/main/merged.yaml" >> $GITHUB_STEP_SUMMARY
