<html lang="zh-CN">

<title>阅读器 · 兼容版</title>
<style type="text/css">
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#ffffff;color:#111111;font-family:-apple-system,'PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.65}
body.theme-dark{background:#0f0f0f;color:#e6e6e6}
a{color:#0055cc;text-decoration:none}

.wrap{max-width:760px;margin:0 auto;padding:0 14px}
.top{padding:14px 0;border-bottom:2px solid #111111}

.site{font-size:1.3em;font-weight:bold}
.tag{font-size:.75em;color:#888;margin-left:8px}
.bar{padding:12px 0 4px;border-bottom:1px solid #eeeeee}

.btn{display:inline-block;padding:10px 16px;font-size:1em;border:1px solid #999999;border-radius:6px;background:#f2f2f2;color:#111111;cursor:pointer;margin:0 8px 8px 0;line-height:1.2}
body.theme-dark .btn{background:#232323;color:#e6e6e6;border-color:#666666}
.btn.primary{background:#0066cc;border-color:#0066cc;color:#ffffff}
input[type=text],input[type=file],select,textarea{display:block;width:100%;box-sizing:border-box;-webkit-box-sizing:border-box;padding:11px 12px;font-size:1em;border:1px solid #999999;border-radius:6px;background:#ffffff;color:#111111;margin:0 0 8px}
body.theme-dark input[type=text],body.theme-dark select,body.theme-dark textarea{background:#1b1b1b;color:#e6e6e6;border-color:#666666}
textarea{height:130px;font-family:inherit;font-size:.95em}
.box{border:1px solid #bbbbbb;border-radius:8px;padding:12px;margin:12px 0;background:#fafafa;display:none}

.box-title{font-weight:bold;margin-bottom:8px}
.row{margin-top:6px}
.doc{border-bottom:1px solid #dddddd;padding:12px 0}
body.theme-dark .doc{border-color:#2e2e2e}
.doc .t{display:block;font-size:1.12em;font-weight:bold;padding:2px 0;word-break:break-all}
.doc .m{font-size:.82em;color:#888888;margin-top:2px;word-break:break-all}
.msg{display:none;margin:8px 0;padding:10px 12px;border:1px solid #d9a300;border-radius:6px;background:#fff8e1;font-size:.92em}
body.theme-dark .msg{background:#2a2410;border-color:#8a6d00}
.empty{padding:40px 10px;text-align:center;color:#999999}
.foot{margin:28px 0;padding-bottom:40px;text-align:center;font-size:.8em;color:#999999}

.pginput{display:inline-block;width:70px;margin:0 6px;padding:8px}
.rd-content{font-size:18px;line-height:1.8}
.toclist a{display:block;padding:8px 0;border-bottom:1px solid #eeeeee;color:#0055cc;word-break:break-all}
body.theme-dark .toclist a{border-color:#2e2e2e;color:#7db2ff}
.mini{font-size:.85em;color:#888888}
/* ===================== 阅读视图 v3（按屏分页） ===================== */
/* 主题底色（晚于 .theme-dark 定义，覆盖之） */
body.rd-th-paper{--rd-bg:#fdfdfb;--rd-fg:#1b1b1b;background:#fdfdfb;color:#1b1b1b}
body.rd-th-sepia{--rd-bg:#f4ecd8;--rd-fg:#43331f;background:#f4ecd8;color:#43331f}
body.rd-th-green{--rd-bg:#dfeee1;--rd-fg:#20372a;background:#dfeee1;color:#20372a}
body.rd-th-night{--rd-bg:#121212;--rd-fg:#c9c9c9;background:#0f0f0f;color:#c9c9c9}
body.rd-th-black{--rd-bg:#000000;--rd-fg:#9a9a9a;background:#000000;color:#9a9a9a}
.rd{position:fixed;left:0;top:0;right:0;bottom:0;overflow:hidden;z-index:60;
 background:var(--rd-bg,#fdfdfb);color:var(--rd-fg,#1b1b1b);-webkit-user-select:none;user-select:none}
.rd-stage{position:absolute;left:0;right:0;top:0;bottom:52px;overflow:hidden;z-index:1;
 -webkit-user-select:text;user-select:text;-webkit-tap-highlight-color:rgba(0,0,0,0)}
.rd-clip{position:absolute;left:16px;top:12px;width:320px;height:400px;overflow:hidden;z-index:1}
.rd-flow{position:absolute;left:0;top:0;width:320px;height:400px;overflow:visible;
 -webkit-transform:translateX(0px);transform:translateX(0px);-webkit-backface-visibility:hidden}
.rd-flow p{margin:0 0 .7em;padding:0;text-indent:2em;text-align:justify;line-height:inherit;
 word-wrap:break-word;overflow-wrap:break-word;word-break:normal}
.rd-flow .rd-h{font-weight:bold;text-indent:0;margin-top:.1em}
.rd-flow .rd-hh{font-size:1.08em}
.rd-sltext{white-space:pre-wrap;word-wrap:break-word;overflow-wrap:break-word;word-break:normal}
/* 顶栏 */
.rd-top{position:absolute;left:0;right:0;top:0;height:44px;line-height:44px;z-index:3;display:none;
 background:rgba(0,0,0,.05);border-bottom:1px solid rgba(0,0,0,.09);white-space:nowrap;overflow:hidden}
body.theme-dark .rd-top{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12)}
.rd-top.show{display:block}
.rd-tb{display:inline-block;padding:0 11px;height:44px;line-height:44px;background:transparent;border:none;
 color:inherit;font-size:14px;cursor:pointer;font-family:inherit;vertical-align:top;-webkit-tap-highlight-color:transparent}
.rd-tb:active{background:rgba(0,0,0,.08)}
.rd-tb.r{float:right}
.rd-tt{display:inline-block;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
 vertical-align:top;font-size:13px;opacity:.7;padding:0 4px}
/* 底栏 */
.rd-foot{position:absolute;left:0;right:0;bottom:0;z-index:3;background:rgba(0,0,0,.05);
 border-top:1px solid rgba(0,0,0,.09);padding-bottom:0}
body.theme-dark .rd-foot{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12)}
.rd-fi{display:table;width:100%;table-layout:fixed;height:51px}
.rd-fc{display:table-cell;width:76px;vertical-align:middle;padding:0 10px}
.rd-fc.r{text-align:right}
.rd-fp{display:table-cell;vertical-align:middle;text-align:center;font-size:13px;opacity:.72;

.rd-nav{display:inline-block;min-width:56px;height:42px;line-height:40px;font-size:20px;padding:0 6px;

 font-family:inherit;vertical-align:middle;-webkit-tap-highlight-color:transparent}
body.theme-dark .rd-nav{border-color:rgba(255,255,255,.22)}
.rd-nav:active{background:rgba(0,0,0,.1)}

.rd-slide{display:none;padding:0 14px 10px}
.rd-foot.open .rd-slide{display:block}
.rd-slide input[type=range]{display:block;width:100%;margin:0;padding:0}
.rd-rail{position:absolute;right:0;top:50%;margin-top:-34px;width:18px;height:68px;z-index:3;

 color:rgba(0,0,0,.3);-webkit-tap-highlight-color:transparent}
body.theme-dark .rd-rail{color:rgba(255,255,255,.35)}
.rd-rail.show{display:block}
/* 亮度遮罩 */
.rd-dim{position:fixed;left:0;top:0;right:0;bottom:0;background:#000000;opacity:0;
 pointer-events:none;z-index:2}
/* 抽屉 */
.rd-mask{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:70;display:none}
.rd-mask.show{display:block}
.rd-toc{position:fixed;right:0;top:0;bottom:0;width:86%;max-width:420px;z-index:80;display:none;
 background:#ffffff;color:#111111;box-shadow:-3px 0 14px rgba(0,0,0,.22);overflow:hidden}
body.theme-dark .rd-toc{background:#151515;color:#e6e6e6}
.rd-toc.show{display:block}
.rd-dh{height:48px;line-height:48px;padding:0 12px;border-bottom:1px solid rgba(0,0,0,.1);
 font-weight:bold;font-size:15px}
body.theme-dark .rd-dh{border-color:rgba(255,255,255,.12)}
.rd-tcw{padding:6px 10px;border-bottom:1px solid rgba(0,0,0,.08)}
body.theme-dark .rd-tcw{border-color:rgba(255,255,255,.1)}
.rd-tcw input{margin:0;padding:8px 10px;font-size:14px}
.rd-tcl{position:absolute;left:0;right:0;top:101px;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.rd-ti{display:block;padding:11px 12px;border-bottom:1px solid rgba(0,0,0,.07);font-size:14px;
 color:#0055cc;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.theme-dark .rd-ti{border-color:rgba(255,255,255,.08);color:#7db2ff}
.rd-ti.on{background:rgba(0,102,204,.12);font-weight:bold}
.rd-ti .pg{float:right;font-size:12px;opacity:.55;margin-left:8px;font-weight:normal}
.rd-set{position:fixed;left:0;right:0;bottom:0;z-index:80;display:none;background:#ffffff;color:#111111;
 border-radius:14px 14px 0 0;box-shadow:0 -3px 16px rgba(0,0,0,.22);overflow:hidden;max-height:82%}
body.theme-dark .rd-set{background:#151515;color:#e6e6e6}
.rd-set.show{display:block}
.rd-sbody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 14px 20px;max-height:70vh}
.rd-grp{margin:15px 0 7px;font-size:12px;letter-spacing:.05em;opacity:.6}
.rd-row{display:block;padding:5px 0}
.rd-lab{font-size:14px;margin-bottom:7px;line-height:1.3}
.rd-lab .v{opacity:.6;font-size:12px;margin-left:6px}
.seg{display:block;font-size:0;line-height:0}
.sg{display:inline-block;font-size:13px;line-height:1.15;padding:8px 13px;margin:0 7px 7px 0;
 border:1px solid rgba(0,0,0,.2);border-radius:9px;background:rgba(0,0,0,.04);color:inherit;
 cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent}
body.theme-dark .sg{border-color:rgba(255,255,255,.22);background:rgba(255,255,255,.06)}
.sg.on{background:#0066cc;border-color:#0066cc;color:#ffffff}
/* 阅读时提示条浮起 */
body.reading #topMsg{position:fixed;left:8px;right:8px;top:8px;z-index:9;margin:0;box-shadow:0 2px 10px rgba(0,0,0,.2)}
</style>

<script type="text/javascript">
setTimeout(function(){
 openDoc=function(id){
  try{document.title='T1 id='+id;}catch(e){}
  var d0=findDoc(id);
  document.title='T2 d0='+(d0&&d0.title);
  msg('打开文档：'+((d0&&d0.title)||id)+' ...',true);
  document.title='T3 msgdone topMsg='+(!!document.getElementById('topMsg'));
  ajax('GET',API+'/reader/get?id='+encodeURIComponent(id),null,{'Accept':'application/json'},function(err,code,text){
   document.title='CB err='+(err?err.message:'no')+' code='+code+' len='+(text?text.length:0);
   if(err){msg('打开失败：'+err.message);return;}
   var d=jsonParse(text||'');
   if(!d||d.content===undefined||d.content===null){msg('内容缺失');return;}
   document.title='CB2 ok len='+String(d.content).length;
   CUR=d;CONTENT=String(d.content);
   show('read');
   document.title='CB3 shown vRead='+document.getElementById('vRead').style.display;
  },60000);
 };
},1200);
</script>
</head>

 <div class="top">

  if(opts&&opts.up&&x.upload){try{x.upload.onprogress=function(ev){if(ev){opts.up(ev.loaded||0,ev.total||0,!!ev.lengthComputable);}};}catch(e){}}
  if(opts&&opts.down){try{x.onprogress=function(ev){if(ev){opts.down(ev.loaded||0,ev.total||0,!!ev.lengthComputable);}};}catch(e){}}
  x.onreadystatechange=function(){if(x.readyState===4){if(x.status>=200&&x.status<300){finish(null,x.status,x.responseText);}else{finish(new Error('HTTP '+x.status),x.status,x.responseText);}}};
  timer=setTimeout(function(){if(!done){try{x.abort();}catch(e){}finish(new Error('网络超时'),0,null);}},timeoutMs||15000);
  if(body!==null&&body!==undefined){x.send(body);}else{x.send();}
 }catch(e){finish(e,0,null);}
}

function doSrcSearch(){
 if(SR_BUSY){msg('正在搜索中，请稍候');return;}
 var q=trimS(val('srcQ'));
 if(!q){msg('请输入书名或作者');return;}
 if(!SRCS.length){msg('请先导入书源（书源管理）');return;}
 var cand=[];
 for(var ii=0;ii<SRCS.length;ii++){
  var ss=SRCS[ii];
  if(!ss.searchUrl)continue;
  var u=buildSearchUrl(ss,q);
  if(!u)continue;
  var tone=(ss._ok||0)-((ss._srcFail||0)*2);
  cand.push({s:ss,u:u,tone:tone});
 }
 cand.sort(function(a,b){return b.tone-a.tone;});
 var CONC=6;
 SR_BUSY=true;SR_RESULTS=[];SR_SEARCH_STOP=false;
 showSrcSearch();
 var t0=new Date().getTime();
 var hitSrc=0,done=0,total=cand.length,searched=0;
 var el=$("srcResults");if(el){el.innerHTML='并发搜索 '+total+' 个书源（并发 '+CONC+'）<a href="javascript:srStop()" style="color:#c00">[停止]</a>';}
 function updStat(){
  setSrcStat('已搜 '+searched+'/'+total+' · 命中 '+hitSrc+' · 找到 '+SR_RESULTS.length+' 条 · 用时 '+elapsed(t0));
  if(el){el.innerHTML='并发搜索中... 已搜 '+searched+'/'+total+' · 命中 '+hitSrc+' 个源 · 找到 '+SR_RESULTS.length+' 条 · 用时 '+elapsed(t0)+' <a href="javascript:srStop()" style="color:#c00">[停止]</a>';}
  if(SR_RESULTS.length){renderSrcResults();}
 }
 function worker(){
  if(SR_SEARCH_STOP||done>=cand.length){return;}
  var idx=done;done++;
  if(idx>=cand.length){return;}
  var c=cand[idx];var s=c.s,u=c.u;searched++;
  proxyFetch(u,function(err,text,finalUrl){
   var ok=false;
   if(!err&&text){
    try{
     var doc=htmlDoc(text);
     var items=doc?parseSearch(s,doc,finalUrl||u):[];
     if(items.length){ok=true;hitSrc++;s._ok=(s._ok||0)+1;}
     for(var k=0;k<items.length;k++){SR_RESULTS.push(items[k]);}
    }catch(e){ok=false;}
   }
   if(!ok){s._srcFail=(s._srcFail||0)+1;}
   updStat();worker();
  });
 }
 for(var w=0;w<CONC;w++){worker();}
 var fin=setInterval(function(){
  if(SR_SEARCH_STOP){
   clearInterval(fin);SR_BUSY=false;
   setSrcStat('已停止：已搜 '+searched+'/'+total+' · '+SR_RESULTS.length+' 条');
   rankSrc();renderSrcResults();return;
  }
  if(done>=cand.length){
   clearInterval(fin);
   setTimeout(function(){
    SR_BUSY=false;rankSrc();
    setSrcStat('完成：'+SR_RESULTS.length+' 条 · 命中 '+hitSrc+'/'+total+' 源 · 用时 '+elapsed(t0));
    msg('搜索完成：'+SR_RESULTS.length+' 条结果（命中 '+hitSrc+'/'+total+' 个源，用时 '+elapsed(t0)+'）');
    renderSrcResults();
   },400);
  }
 },120);
}
function srStop(){SR_SEARCH_STOP=true;}
function rankSrc(){
 var score=function(x){return x.bs?((x.bs._srcFail||0)*2-(x.bs._ok||0)):0;};
 SR_RESULTS.sort(function(a,b){return score(a)-score(b);});
 var seen={},out=[];
 for(var i=0;i<SR_RESULTS.length;i++){
  var r=SR_RESULTS[i];
  var key=(r.name||'')+'|'+(r.author||'');
  if(seen[key])continue;
  seen[key]=1;out.push(r);
 }
 SR_RESULTS=out;
}
function buildSearchUrl(s,q){
 var t=String(s.searchUrl||'');
 if(!t)return '';
 t=t.replace(/\{\{\s*key\s*\}\}/g,encodeURIComponent(q)).replace(/\{key\}/g,encodeURIComponent(q));
 return fullUrl(t,s.bookSourceUrl||'');
}

function proxyFetch(url,cb,timeoutMs){
 var x=null,done=false,timer=null;
 try{x=new XMLHttpRequest();}catch(e){}
 if(!x){cb(new Error('浏览器不支持抓取'));return;}
 function fin(err,text,furl){if(done)return;done=true;if(timer){try{clearTimeout(timer);}catch(e){}}cb(err,text,furl);}
 try{
  x.open('GET',API+'/reader/proxy?url='+encodeURIComponent(url),true);
  x.setRequestHeader('Accept','*/*');
  x.onreadystatechange=function(){
   if(x.readyState===4){
    if(x.status>=200&&x.status<300){
     var furl='';
     try{var h=x.getResponseHeader('X-Final-Url');if(h)furl=decodeURIComponent(h);}catch(e){}
     fin(null,x.responseText||'',furl);
    }else{
     var e2='抓取失败 HTTP '+x.status;
     try{if(x.responseText)e2+='：'+String(x.responseText).substring(0,60);}catch(e){}
     fin(new Error(e2));
    }
   }
  };
  timer=setTimeout(function(){if(!done){try{x.abort();}catch(e){}fin(new Error('抓取超时'));}},timeoutMs||25000);
  x.send();
 }catch(e){fin(e);}
}

var _srFrame=null;
function htmlDoc(html){
 if(!_srFrame){
  _srFrame=document.createElement('iframe');
  _srFrame.style.width='1px';_srFrame.style.height='1px';
  _srFrame.style.position='absolute';_srFrame.style.left='-9999px';
  try{_srFrame.setAttribute('sandbox','allow-same-origin');}catch(e){}
  document.body.appendChild(_srFrame);
 }
 var doc=null;
 try{doc=_srFrame.contentDocument||_srFrame.contentWindow.document;}catch(e){return null;}
 if(!doc)return null;
 var safe=String(html)
  .replace(/<script[\s\S]*?<\/script>/gi,'')
  .replace(/<script[^>]*>/gi,'')
  .replace(/\son\w+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi,'');
 try{doc.open();doc.write(safe);doc.close();}catch(e){return null;}
 return doc;
}

function pickAll(rule,ctx,baseUrl){
 var parts=String(rule||'').split('||');
 for(var p=0;p<parts.length;p++){
  var r=trimS(parts[p]);if(!r)continue;
  var res=runRule(r,ctx,baseUrl);
  if(res&&res.length)return res;
 }
 return [];
}
function runRule(r,ctx,baseUrl){
 if(!ctx)return [];
 if(r.indexOf('//')===0||r.indexOf('(/')===0){return xpathAll(r,ctx);}
 if(r.indexOf('@css:')===0){return cssAll(trimS(r.substring(5)),ctx);}
 var m=r.match(/^(class|id|tag)\.(.+)$/);
 if(m){
  var sel=(m[1]==='class')?('.'+m[2]):((m[1]==='id')?('#'+m[2]):m[2]);
  return cssAll(sel,ctx);
 }
 if(r.charAt(0)==='.'||r.charAt(0)==='#'){return cssAll(r,ctx);}
 return [];
}
function mkItem(n){
 if(!n)return null;
 var it={node:n,text:'',href:''};
 try{
  if(n.nodeType===2){it.text=String(n.nodeValue||'');}
  else if(n.nodeType===3){it.text=String(n.nodeValue||'');}
  else{
   it.text=String(n.textContent!==undefined?n.textContent:(n.innerText||''));
   if(n.getAttribute){it.href=n.getAttribute('href')||'';}
  }
 }catch(e){}
 it.text=trimS(it.text);
 return it;
}
function xpathAll(r,ctx){
 var out=[];
 var doc=null;
 try{doc=ctx.ownerDocument||ctx;}catch(e){}
 if(!doc||!doc.evaluate)return out;
 var res=null;
 try{res=doc.evaluate(r,ctx,null,XPathResult.ORDERED_NODE_SNAPSHOT_TYPE,null);}catch(e){return out;}
 for(var i=0;i<res.snapshotLength;i++){
  var it=mkItem(res.snapshotItem(i));if(it)out.push(it);
 }
 return out;
}
function cssAll(sel,ctx){
 var out=[];
 if(!ctx||!ctx.querySelectorAll)return out;
 var list=null;
 try{list=ctx.querySelectorAll(sel);}catch(e){return out;}
 for(var i=0;i<list.length;i++){var it=mkItem(list[i]);if(it)out.push(it);}
 return out;
}
function pickText(rule,ctx,baseUrl,joinStr){
 var list=pickAll(rule,ctx,baseUrl);var arr=[];
 for(var i=0;i<list.length;i++){var t=list[i].text;if(t){arr.push(t);}}
 return arr.join(joinStr===undefined?'':joinStr);
}
function pickHref(rule,ctx,baseUrl){
 var list=pickAll(rule,ctx,baseUrl);
 for(var i=0;i<list.length;i++){
  var it=list[i];
  var v=trimS(it.href||it.text);
  if(v){
   if(v.indexOf('javascript:')===0||v.charAt(0)==='#'){
    if(it.href&&it.text&&it.text!==it.href){v=trimS(it.text);}else{continue;}
   }
   return fullUrl(v,baseUrl);
  }
 }
 return '';
}
function fullUrl(u,base){
 u=trimS(u);
 if(!u)return '';
 if(/^https?:\/\//i.test(u))return u;
 if(u.indexOf('//')===0)return 'https:'+u;
 if(u.charAt(0)==='/'){var m=String(base||'').match(/^(https?:\/\/[^\/]+)/i);return (m?m[1]:'')+u;}
 if(!base)return u;
 return String(base).replace(/[^\/]*$/,'')+u;
}

function parseSearch(s,doc,finalUrl){
 var rule=s.ruleSearch||{};
 var base=s.bookSourceUrl||finalUrl||'';
 var cont=pickAll(rule.bookList||'',doc,base);
 var out=[];
 for(var i=0;i<cont.length;i++){
  var c=cont[i];if(!c.node)continue;
  var name=pickText(rule.name||'',c.node,base,'');
  var author=pickText(rule.author||'',c.node,base,'');
  var burl=pickHref(rule.bookUrl||'',c.node,base);
  if(!name||!burl)continue;
  out.push({srcName:s.bookSourceName||s.bookSourceUrl||'',name:name,author:author,url:burl,bs:s});
 }
 return out;
}
function parseToc(s,doc,base){
 var rule=s.ruleToc||{};
 var cont=pickAll(rule.chapterList||'',doc,base);
 var out=[];
 for(var i=0;i<cont.length;i++){
  var c=cont[i];if(!c.node)continue;
  var name=pickText(rule.chapterName||'',c.node,base,'');
  var url=pickHref(rule.chapterUrl||'',c.node,base);
  if(name&&url)out.push({name:name,url:url});
 }
 return out;
}

function openBook(item){
 if(SR_BUSY)return;
 SR_BUSY=true;msg('打开书籍...',true);
 var s=item.bs,bookUrl=item.url;
 proxyFetch(bookUrl,function(err,text,finalUrl){
  if(err){SR_BUSY=false;msg('打开失败：'+err.message);return;}
  var doc=htmlDoc(text);
  if(!doc){SR_BUSY=false;msg('页面解析失败');return;}
  var base=finalUrl||bookUrl;
  var chs=parseToc(s,doc,base);
  if(chs.length){SR_BUSY=false;SR_SEL=item;SR_CHS=chs;msg('');renderSrcToc();showSrcToc();return;}
  var tocRule=(s.ruleBookInfo&&s.ruleBookInfo.tocUrl)||'';
  if(tocRule){
   var tocUrl=pickHref(tocRule,doc,base);
   if(tocUrl){
    proxyFetch(tocUrl,function(err2,text2,finalUrl2){
     SR_BUSY=false;
     if(err2){msg('目录页抓取失败：'+err2.message);return;}
     var doc2=htmlDoc(text2);
     var chs2=doc2?parseToc(s,doc2,finalUrl2||tocUrl):[];
     if(chs2.length){SR_SEL=item;SR_CHS=chs2;msg('');renderSrcToc();showSrcToc();}
     else{msg('未解析到目录（规则不匹配）');}
    });
    return;
   }
  }
  SR_BUSY=false;msg('未解析到目录（规则不匹配，可换其他书源结果）');
 });
}
function openChapter(i){
 if(SR_BUSY)return;
 if(i<0||i>=SR_CHS.length)return;
 SR_BUSY=true;
 var ch=SR_CHS[i];
 var s=SR_SEL?SR_SEL.bs:null;
 if(!s){SR_BUSY=false;return;}
 var t0=new Date().getTime();
 msg('加载第 '+(i+1)+'/'+SR_CHS.length+' 章（'+calcPct(i+1,SR_CHS.length)+'）：'+ch.name+' ...',true);
 proxyFetch(ch.url,function(err,text,finalUrl){
  SR_BUSY=false;
  if(err){msg('章节加载失败：'+err.message);return;}
  var doc=htmlDoc(text);
  if(!doc){msg('页面解析失败');return;}
  var rule=s.ruleContent||{};
  var body=pickText(rule.content||'',doc,finalUrl||ch.url,'\n');
  if(!body){msg('正文提取为空（该规则可能不支持）');return;}
  body=body.replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n');
  SR_CHIDX=i;
  var t=$('srcChapTitle');
  if(t){t.textContent='第 '+(i+1)+'/'+SR_CHS.length+' 章（'+calcPct(i+1,SR_CHS.length)+'）· '+ch.name+' · 本章 '+body.length+' 字 · 加载 '+elapsed(t0);}
  showSrcRead();
  VIEW.src.defTitle=ch.name;
  VIEW.src.setDoc(body,0,true);
  msg('已加载：'+ch.name+'（本章 '+body.length+' 字，用时 '+elapsed(t0)+'）');
 });
}

/* ---------- 章节分段 ---------- */
var RD_CH_RE=[
 /^第\s*[0-9０-９零一二三四五六七八九十百千两壹贰叁肆伍陆柒捌玖拾]{1,12}\s*[章节回卷篇集部幕]/,
 /^(序章|序言|楔子|引子|尾声|后记|番外|前言|引言|终章|大结局|正文)/,
 /^(chapter|part|book|volume|prologue|epilogue)\b/i,
 /^[#]{1,4}\s*\S/,
 /^[一二三四五六七八九十百零]{1,3}\s*[、.．]\s*\S/
];
function rdIsChap(t){
 if(!t||t.length>48)return 0;
 for(var i=0;i<RD_CH_RE.length;i++){if(RD_CH_RE[i].test(t))return 1;}
 return 0;
}
function rdBuildSegs(text){
 var segs=[],n=text.length,s=0,i,line,t,curStart=0,curTitle='';
 while(s<n){
  i=text.indexOf('\n',s);if(i<0)i=n;
  line=text.substring(s,i);
  t=line.replace(/^\s+|\s+$/g,'');
  if(t.length&&rdIsChap(t)){
   if(s>curStart&&(s-curStart)>0)segs.push({pos:curStart,len:s-curStart,t:curTitle});
   curStart=s;curTitle=t.replace(/^[#]{1,4}\s*/,'').substring(0,60);
  }
  s=i+1;
 }
 if(curStart<n)segs.push({pos:curStart,len:n-curStart,t:curTitle});
 if(!segs.length)segs.push({pos:0,len:n,t:''});
 if(segs.length>1&&segs[0].len<400&&!segs[0].t){segs[1].pos=segs[0].pos;segs[1].len+=segs[0].len;segs.shift();}
 var out=[],k,g,p,end,q,nl,first;
 for(k=0;k<segs.length;k++){
  g=segs[k];
  if(g.len<=RD_PARTSZ*1.5){out.push(g);continue;}
  p=g.pos;end=g.pos+g.len;first=1;
  while(p<end){
   q=Math.min(end,p+RD_PARTSZ);
   if(q<end){nl=text.lastIndexOf('\n',q);if(nl>p+3000)q=nl+1;}
   out.push({pos:p,len:q-p,t:first?g.t:(g.t?g.t+'（续）':''),sub:first?0:1});
   p=q;first=0;
  }
 }
 return out;
}
function rdBuiltToc(segs){
 var toc=[],i;
 for(i=0;i<segs.length;i++){if(segs[i].t)toc.push({t:segs[i].t,pos:segs[i].pos});}
 if(!toc.length){
  for(i=0;i<segs.length;i++){toc.push({t:'第 '+(i+1)+' 段',pos:segs[i].pos});}
 }
 return toc;
}

function rdColTest(){

 }catch(e){return 0;}

/* ---------- 视图（一本书 / 一章） ---------- */
function rdViewer(o){
 var v={};var k;for(k in o){if(o.hasOwnProperty(k))v[k]=o[k];}
 v.segs=null;v.seg=0;v.doc='';v.cur='';v.page=1;v.pages=1;v.pageOff=[0];v.off=0;
 v.W=0;v.H=0;v.mode=RD_COLMODE?'col':'flow';v.slices=null;v.paras=[];v.busy=0;
 v.geom=function(){
  var st=v.stage;if(!st)return 0;
  var sw=st.clientWidth,sh=st.clientHeight;
  if(sw<60||sh<60)return 0;
  var pad=RD_CFG.pad*1;if(!(pad>=4))pad=16;
  var w=sw-2*pad;if(w<80){pad=8;w=sw-16;}
  var left=pad;
  if(RD_CFG.wide*1&&w>720){w=720;left=Math.round((sw-w)/2);}
  var h=sh-2*RD_VPAD;if(h<80)h=sh-12;
  v.W=w;v.H=h;
  var f=v.flow;
  if(f){
   var cl=f.parentNode;
   if(cl&&cl.className&&cl.className.indexOf('rd-clip')>=0){
    cl.style.left=left+'px';cl.style.top=RD_VPAD+'px';
    cl.style.width=w+'px';cl.style.height=h+'px';
    f.style.left='0px';f.style.top='0px';
   }else{
    f.style.left=left+'px';f.style.top=RD_VPAD+'px';
   }
   f.style.width=w+'px';f.style.height=h+'px';
   if(v.mode==='col'){
    try{f.style.webkitColumnWidth=w+'px';f.style.columnWidth=w+'px';f.style.webkitColumnGap='0px';f.style.columnGap='0px';f.style.webkitColumnFill='auto';f.style.columnFill='auto';}catch(e){}
   }
  }
  return 1;
 };
 v.buildParas=function(t){
  var ps=[],s=0,n=t.length,i,line,x,mark;
  while(s<n){
   i=t.indexOf('\n',s);if(i<0)i=n;
   line=t.substring(s,i).replace(/\s+$/,'');
   x=line.replace(/^\s+/,'');
   if(x.length&&!/^-{3,}$/.test(x)){
    mark=(/^第\s*[0-9０-９零一二三四五六七八九十百千两壹贰叁肆伍陆柒捌玖拾]{1,12}\s*[章节回卷篇集部]/.test(x)||/^#{1,4}\s/.test(x)||/^(序章|楔子|尾声|番外|后记)/.test(x))?1:0;
    ps.push({t:x,off:s,mark:mark});
   }
   s=i+1;
  }
  return ps;
 };
 v.fill=function(ps){
  var f=v.flow;if(!f)return;
  f.innerHTML='';
  var i,p,frag=document.createDocumentFragment();
  for(i=0;i<ps.length;i++){
   p=document.createElement('p');
   if(ps[i].mark)p.className='rd-h rd-hh';
   p.appendChild(document.createTextNode(ps[i].t));
   ps[i].el=p;frag.appendChild(p);
  }
  f.appendChild(frag);
 };
 v.measure=function(){
  var f=v.flow,W=v.W;
  f.style.transition='';f.style.webkitTransition='';
  f.style.transform='translateX(0px)';f.style.webkitTransform='translateX(0px)';
  var n=Math.round(f.scrollWidth/W);if(!(n>0))n=1;
  var po=[],i;
  for(i=0;i<=n+1;i++)po.push(-1);
  po[1]=0;
  var ps=v.paras,base,el,l,pg;
  if(ps.length&&ps[0].el){
   base=f.getBoundingClientRect().left;
   for(i=0;i<ps.length;i++){
    el=ps[i].el;
    l=el.getBoundingClientRect().left-base;
    pg=Math.round(l/W)+1;
    if(pg<1)pg=1;if(pg>n)pg=n;
    if(po[pg]<0||ps[i].off<po[pg])po[pg]=ps[i].off;
   }
  }
  for(i=2;i<=n;i++){if(po[i]<0)po[i]=po[i-1];}
  v.pageOff=po;v.pages=n;
 };
 v.slicePages=function(t){
  var m=$('rdMeasure');
  if(!m){m=document.createElement('div');m.id='rdMeasure';document.body.appendChild(m);}
  m.style.cssText='position:absolute;left:-99999px;top:0;overflow:hidden;white-space:pre-wrap;word-wrap:break-word';
  m.style.width=v.W+'px';m.style.height=v.H+'px';
  m.style.fontSize=RD_CFG.fs+'px';m.style.lineHeight=String(RD_CFG.lh);
  m.style.fontFamily=RD_FONTS[RD_CFG.font]||'inherit';
  var arr=[],s=0,n=t.length,lo,hi,mid,best,cut;
  while(s<n){
   lo=s+1;hi=Math.min(n,s+8000);best=lo;
   while(lo<=hi){
    mid=(lo+hi)>>1;
    m.textContent=t.substring(s,mid);
    if(m.scrollHeight<=m.clientHeight+1){best=mid;lo=mid+1;}else{hi=mid-1;}
   }
   if(best<=s)best=Math.min(n,s+1);
   cut=t.substring(s,best).lastIndexOf('\n');
   if(cut>30&&best<n)best=s+cut+1;
   arr.push([s,best]);s=best;
  }
  if(!arr.length)arr.push([0,0]);
  return arr;
 };
 v.pageOfOff=function(off){
  var po=v.pageOff,lo=1,hi=v.pages,best=1;
  while(lo<=hi){var mid=(lo+hi)>>1;if(po[mid]<=off){best=mid;lo=mid+1;}else{hi=mid-1;}}
  if(best>v.pages)best=v.pages;
  if(best<1)best=1;
  return best;
 };
 v.applyPage=function(noAnim){
  var f=v.flow;if(!f)return;
  var anim=RD_CFG.anim;
  if(v.mode==='col'){
   var tr='';
   if(anim==='slide'&&!noAnim&&!RD_REDUCE)tr='transform .24s ease-out';
   try{f.style.webkitTransition=tr?('-webkit-'+tr):'';f.style.transition=tr;}catch(e){}
   var tx=-((v.page-1)*v.W);
   f.style.transform='translateX('+tx+'px)';f.style.webkitTransform='translateX('+tx+'px)';
   if(anim==='fade'&&!noAnim&&!RD_REDUCE){
    try{f.style.transition='opacity .16s linear';f.style.opacity='0.15';
     setTimeout(function(){f.style.opacity='1';},30);}catch(e){}
   }
  }else{
   var s=v.slices?(v.slices[v.page-1]||[0,0]):[0,0];
   f.innerHTML='';
   var d=document.createElement('div');d.className='rd-sltext';
   d.appendChild(document.createTextNode(v.cur.substring(s[0],s[1])));
   f.appendChild(d);
  }
 };
 v.abs=function(){return (v.segs&&v.segs[v.seg]?v.segs[v.seg].pos:0)+v.off;};
 v.sync=function(){
  var c=RD_CFG,pg=v.page,tt=v.pages,abs=v.abs(),len=v.doc.length||1;
  var pct=Math.round(abs*1000/len)/10;
  var txt='';
  if(c.prog==='page')txt=pg+' / '+tt+' 屏';
  else if(c.prog==='pct')txt=pct+'%';
  else txt='第 '+pg+' / '+tt+' 屏 · '+pct+'%';
  if(v.progEl)v.progEl.textContent=txt;
  if(v.range){try{v.range.max=String(tt);v.range.value=String(pg);}catch(e){}}
  if(v.navPrev)v.navPrev.disabled=(pg<=1&&v.seg<=0);
  if(v.navNext)v.navNext.disabled=(pg>=tt&&v.segs&&v.seg>=v.segs.length-1);
  if(v.titleEl){var g=v.segs?v.segs[v.seg]:null;v.titleEl.textContent=((g&&g.t)?g.t:(v.defTitle||''));}
  if(v.onSync)v.onSync(v);
 };
 v.gotoLocal=function(off,noAnim){
  if(off<0)off=0;
  if(off>v.cur.length)off=v.cur.length;
  v.off=off;
  v.page=v.pageOfOff(off);
  v.applyPage(noAnim);
  v.sync();
 };
 v.openSeg=function(k,localOff,noAnim){
  if(!v.segs||k<0||k>=v.segs.length)return 0;
  v.seg=k;
  var g=v.segs[k];
  v.cur=v.doc.substring(g.pos,g.pos+g.len);
  v.paras=v.buildParas(v.cur);
  if(v.mode==='col'){v.fill(v.paras);}else{v.slices=null;}
  v.off=localOff||0;
  if(!v.geom())return 1;
  v.layoutLocal(v.off,noAnim);
  return 1;
 };
 v.layoutLocal=function(off,noAnim){
  if(!v.geom())return;
  if(v.mode==='col'){
   v.measure();
  }else{
   v.slices=v.slicePages(v.cur);
   var po=[0],i;
   for(i=0;i<v.slices.length;i++)po.push(v.slices[i][0]);
   v.pageOff=po;v.pages=v.slices.length||1;
  }
  v.gotoLocal(off===undefined?v.off:off,noAnim);
 };
 v.segOf=function(abs){
  var gs=v.segs;if(!gs||!gs.length)return 0;
  var lo=0,hi=gs.length-1,best=0;
  while(lo<=hi){var mid=(lo+hi)>>1;if(gs[mid].pos<=abs){best=mid;lo=mid+1;}else{hi=mid-1;}}
  return best;
 };
 v.gotoAbs=function(abs,noAnim){
  if(!v.segs||!v.segs.length)return;
  if(abs<0)abs=0;
  if(abs>v.doc.length)abs=v.doc.length;
  var k=v.segOf(abs);
  var local=abs-v.segs[k].pos;
  if(k!==v.seg||!v.cur){v.openSeg(k,local,noAnim);}
  else{v.gotoLocal(local,noAnim);}
 };
 v.setDoc=function(text,ratio,noAnim){
  v.doc=text||'';
  v.segs=rdBuildSegs(v.doc);
  v.seg=0;v.cur='';v.off=0;v.page=1;v.pages=1;v.pageOff=[0];
  if(!v.geom())return;
  v.gotoAbs(Math.round((ratio||0)*v.doc.length),noAnim);
 };
 v.relayout=function(){if(v.cur){if(!v.geom())return;v.layoutLocal(v.off,true);}};
 v.next=function(){
  if(v.page<v.pages){v.gotoLocal(v.pageOff[v.page+1]);if(v.onMove)v.onMove();return 1;}
  if(v.segs&&v.seg<v.segs.length-1){v.openSeg(v.seg+1,0);if(v.onMove)v.onMove();return 1;}
  if(v.atEnd)return v.atEnd();
  return 0;
 };
 v.prev=function(){
  if(v.page>1){v.gotoLocal(v.pageOff[v.page-1]);if(v.onMove)v.onMove();return 1;}
  if(v.segs&&v.seg>0){v.openSeg(v.seg-1,999999999);if(v.onMove)v.onMove();return 1;}
  if(v.atStart)return v.atStart();
  return 0;
 };
 v.toc=function(){return v.segs?rdBuiltToc(v.segs):[];};
 return v;
}
/* ---------- 界面：工具栏 / 抽屉 / 设置 / 目录 / 手势 ---------- */
function rdSetDef(k){for(var i=0;i<RD_SET_DEF.length;i++){var d=RD_SET_DEF[i];if(d[0]!=='grp'&&d[1]===k)return d;}return null;}
function rdActive(){var rp=$('srcReadPane');if(rp&&rp.style.display==='block')return VIEW.src;return VIEW.doc;}
function rdRelayout(){var v=rdActive();if(v)v.relayout();}
function rdChrome(){
 var top=$('rdTop'),foot=$('rdFoot'),rail=$('rdRail'),st=$('rdStage');
 var showTop=((RD_CFG.imm*1)?0:1)||RD_TOPON;
 if(top)top.className=showTop?'rd-top show':'rd-top';
 var fh=0;
 if(foot){
  if(RD_CFG.foot*1){foot.style.display='block';fh=foot.offsetHeight||51;}
  else{foot.style.display='none';fh=0;}
 }
 if(rail)rail.className=(showTop&&(RD_CFG.foot*1))?'rd-rail':'rd-rail show';
 if(st){st.style.top=(showTop?44:0)+'px';st.style.bottom=fh+'px';}
 var stop=$('srcTop');if(stop)stop.className='rd-top show';
 var sf=$('srcFoot');if(sf)sf.style.display='block';
 var ss=$('srcStage');if(ss)ss.style.bottom=((sf?sf.offsetHeight:51)||51)+'px';
}
var RD_TOPT=0;
function rdPokeTop(){
 if(!(RD_CFG.imm*1))return;
 RD_TOPON=1;rdChrome();rdRelayout();
 if(RD_TOPT){try{clearTimeout(RD_TOPT);}catch(e){}}
 RD_TOPT=setTimeout(function(){
  RD_TOPT=0;
  if(RD_DRAW)return;
  RD_TOPON=0;rdChrome();rdRelayout();
 },2600);
}
function rdToggleTop(){
 if(!(RD_CFG.imm*1))return;
 if(RD_TOPT){try{clearTimeout(RD_TOPT);}catch(e){}RD_TOPT=0;}
 RD_TOPON=RD_TOPON?0:1;
 rdChrome();rdRelayout();
}
function rdSetTitle(){
 var t=$('rdTocTitle');
 if(t)t.textContent='目录'+((CUR&&CUR.title)?(' · '+CUR.title):'');
}
function rdDrawer(w){
 rdCloseDrawers();
 RD_DRAW=w;
 var mask=$('rdMask');if(mask)mask.className='rd-mask show';
 if(w==='toc'){
  rdTocRender();
  var x=$('rdToc');if(x)x.className='rd-toc show';
 }else if(w==='set'){
  rdSetRender();
  var s=$('rdSet');if(s)s.className='rd-set show';
  var b=$('rdSetBody');
  if(b&&s){try{b.style.maxHeight=Math.max(200,s.offsetHeight-54)+'px';}catch(e){b.style.maxHeight='70vh';}}
 }
}
function rdCloseDrawers(){
 RD_DRAW='';
 var m=$('rdMask');if(m)m.className='rd-mask';
 var t=$('rdToc');if(t)t.className='rd-toc';
 var s=$('rdSet');if(s)s.className='rd-set';
}
function rdSetRender(){
 var b=$('rdSetBody');if(!b)return;
 var h='',i,j,d,cur,dd;
 for(i=0;i<RD_SET_DEF.length;i++){
  d=RD_SET_DEF[i];
  if(d[0]==='grp'){h+='<div class="rd-grp">'+esc(d[1])+'</div>';continue;}
  if(d[0]==='seg'){
   cur=String(RD_CFG[d[1]]);
   h+='<div class="rd-row"><div class="rd-lab">'+esc(d[2])+'</div><div class="seg">';
   for(j=0;j<d[3].length;j++){
    var on=(String(d[3][j][0])===cur)?' on':'';
    h+='<button type="button" class="sg'+on+'" onclick="rdSetK(\''+attr(d[1])+'\',\''+attr(String(d[3][j][0]))+'\')">'+esc(String(d[3][j][1]))+'</button>';
   }
   h+='</div></div>';
   continue;
  }
  h+='<div class="rd-row"><div class="rd-lab">'+esc(d[2])+'<span class="v">'+esc(String(RD_CFG[d[1]]))+'</span></div><div class="seg">';
  h+='<button type="button" class="sg" onclick="rdNum(\''+attr(d[1])+'\',-1)">−</button>';
  h+='<button type="button" class="sg" onclick="rdNum(\''+attr(d[1])+'\',1)">＋</button>';
  h+='</div></div>';
 }
 h+='<div class="rd-row" style="margin-top:18px"><button type="button" class="sg" onclick="rdReset()">恢复默认设置</button></div>';
 b.innerHTML=h;
}
function rdSetK(k,val){
 if(typeof val==='string'&&/^-?[0-9]+(\.[0-9]+)?$/.test(val))val=parseFloat(val);
 RD_CFG[k]=val;
 rdCfgSave();rdApply();rdSetRender();rdChrome();rdRelayout();
}
function rdNum(k,delta){
 var d=rdSetDef(k);if(!d)return;
 var mn=d[3]*1,mx=d[4]*1,stp=d[5]*1||1;
 var v0=(RD_CFG[k]*1)+delta*stp;
 if(v0<mn)v0=mn;if(v0>mx)v0=mx;
 v0=Math.round(v0*100)/100;
 RD_CFG[k]=v0;
 rdCfgSave();rdApply();rdSetRender();rdChrome();rdRelayout();
}
function rdReset(){
 var k;for(k in RD_CFG_DEF){RD_CFG[k]=RD_CFG_DEF[k];}
 rdCfgSave();rdApply();rdSetRender();rdChrome();rdRelayout();
}
function rdTocRender(){
 var v=rdActive();if(!v||!v.doc)return;
 var items=v.toc();
 var list=$('rdTocList');if(!list)return;
 var q=trimS(val('rdTocQ')).toLowerCase();
 var h='',i,shown=0,curAbs=v.abs(),curIdx=-1;
 for(i=0;i<items.length;i++){if(items[i].pos<=curAbs)curIdx=i;else break;}
 for(i=0;i<items.length;i++){
  if(q&&items[i].t.toLowerCase().indexOf(q)<0)continue;
  if(shown>=800){h+='<div class="empty">条目过多，请输入关键词过滤</div>';break;}
  shown++;
  h+='<div class="rd-ti'+(i===curIdx?' on':'')+'" onclick="rdTocGo('+items[i].pos+')">'+esc(items[i].t)+'</div>';
 }
 if(!items.length)h='<div class="empty">未识别到章节标题</div>';
 list.innerHTML=h;
}
function rdTocGo(pos){
 rdCloseDrawers();
 var v=rdActive();if(!v)return;
 v.gotoAbs(pos*1,true);
 if(v.onMove)v.onMove();
}
function rdTap(v,e){
 e=e||window.event;
 if(RD_DRAW||v.busy)return;
 var now=new Date().getTime();
 if(v.swT&&now-v.swT<700)return;
 try{if(window.getSelection){var s=window.getSelection();if(s&&String(s).length>0)return;}}catch(x){}
 var t=RD_CFG.tap;
 if(t==='off')return;
 if(t==='all'){v.next();return;}
 var st=v.stage;if(!st)return;
 var r=st.getBoundingClientRect();
 var x=((e.clientX||0)-(r.left||0))/(r.width||1);
 if(x<0.3)v.prev();else if(x>0.7)v.next();else rdToggleTop();
}
function rdBindView(v){
 var st=v.stage;if(!st)return;
 on(st,'click',function(e){rdTap(v,e);});
 var sx=0,sy=0;
 on(st,'touchstart',function(e){var t=e.touches&&e.touches[0];if(!t)return;sx=t.clientX;sy=t.clientY;});
 on(st,'touchend',function(e){
  if(!(RD_CFG.swipe*1)||RD_DRAW)return;
  var t=e.changedTouches&&e.changedTouches[0];if(!t)return;
  var dx=t.clientX-sx,dy=t.clientY-sy;
  if(Math.abs(dx)<56||Math.abs(dx)<Math.abs(dy)*1.3)return;
  try{if(window.getSelection){var s=window.getSelection();if(s&&String(s).length>0)return;}}catch(x){}
  v.swT=new Date().getTime();
  if(dx<0)v.next();else v.prev();
 });
}
function rdKeys(e){
 e=e||window.event;
 if(!RD_READING)return;
 var k=e.keyCode||e.which;
 if(k===27){if(RD_DRAW)rdCloseDrawers();return;}
 if(RD_DRAW)return;
 var v=rdActive();if(!v)return;
 if(k===37||k===33){v.prev();}else if(k===39||k===34||k===32){v.next();}else{return;}
 if(e.preventDefault)e.preventDefault();
}
/* ---------- 进度 ---------- */
function rdSaveProg(now){
 if(!CUR||!VIEW.doc||!VIEW.doc.doc)return;
 var v=VIEW.doc;
 var pr=v.abs()/(v.doc.length||1);
 if(pr<0)pr=0;if(pr>1)pr=1;
 CUR.progress=pr;
 var d=findDoc(CUR.id);if(d){d.progress=pr;d.lastReadAt=new Date().getTime();}
 if(progTimer){clearTimeout(progTimer);progTimer=null;}
 if(!now){
  progTimer=setTimeout(function(){progTimer=null;rdSaveProg(1);},1600);
  return;
 }
 ajax('POST',API+'/reader/progress',jsonStr({id:CUR.id,progress:pr}),{'Content-Type':'application/json;charset=UTF-8'},function(err){
  if(err)msg('进度保存失败（稍后自动重试）');
 },8000);
}
function saveProgressNow(){rdSaveProg(1);}
function openDoc(id){
 if(!id)return;
 var d0=findDoc(id);
 msg('打开文档：'+((d0&&d0.title)||id)+' ...',true);
 ajax('GET',API+'/reader/get?id='+encodeURIComponent(id),null,{'Accept':'application/json'},function(err,code,text){
  if(err){msg('打开失败：'+err.message);return;}
  var d=jsonParse(text||'');
  if(!d||d.content===undefined||d.content===null){msg('内容缺失');return;}
  CUR=d;CONTENT=String(d.content);
  show('read');
  var v=VIEW.doc;
  v.defTitle=(CUR.title||'');
  v.onMove=function(){rdSaveProg(0);};
  rdSetTitle();
  v.setDoc(CONTENT,d.progress||0,true);
  rdPokeTop();
  var n=(v.segs?v.segs.length:1);
  msg('已打开《'+(CUR.title||'')+'》· 共 '+CONTENT.length+' 字 · '+n+' 段 · 当前 '+(Math.round((d.progress||0)*1000)/10)+'%');
 },60000);
}
function backToLib(){saveProgressNow();show('lib');renderLib();}
init();
</script>
